[package]
name = "sandbox"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
web-sys = { version = "0.3", features = [
    "Blob",
    "BlobPropertyBag",
    "CanvasRenderingContext2d",
    "AddEventListenerOptions",
    "console",
    "Document",
    "DomRect",
    "DomRectReadOnly",
    "Element",
    "Event",
    "EventTarget",
    "File",
    "FileList",
    "FileReader",
    "HtmlAnchorElement",
    "HtmlCanvasElement",
    "HtmlInputElement",
    "ImageData",
    "KeyboardEvent",
    "PointerEvent",
    "Storage",
    "Url",
    "WheelEvent",
    "Window",
] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1